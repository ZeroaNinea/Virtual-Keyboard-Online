<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Keyboard</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f0f12;
            color: #f3f4f6;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        #chat-box {
            flex: 1;
            border: 1px solid #27272a;
            background: #18181b;
            padding: 15px;
            overflow-y: auto;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .message {
            margin-bottom: 8px;
            padding: 8px 12px;
            border-radius: 6px;
            max-width: 75%;
            word-wrap: break-word;
        }
        .me { background: #2563eb; align-self: flex-end; margin-left: auto; }
        .peer { background: #3f3f46; align-self: flex-start; }

        .typing-preview {
            background: #27272a;
            border: 1px solid #3f3f46;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            min-height: 20px;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .keyboard-matrix {
            display: grid;
            grid-template-columns: repeat(11, 1fr); /* Switched to 11 to fit SHIFT and BKSP beautifully */
            gap: 6px;
            margin-bottom: 10px;
        }
        .key {
            background: #3f3f46;
            color: white;
            border: none;
            padding: 14px 0;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
        }
        .shift.pressed {
            background: #2563eb; /* Blue accent color when active */
        }
        .key:hover { background: #52525b; }
        .key.wide { grid-column: span 2; background: #dc2626; }
        .key.space { grid-column: span 7; background: #52525b; }
        .key.send-btn { grid-column: span 4; background: #10b981; color: #000; }

        .macro-row {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            overflow-x: auto;
        }
        .macro {
            background: #27272a;
            border: 1px solid #3f3f46;
            color: #d1d5db;
            padding: 8px 14px;
            border-radius: 20px;
            white-space: nowrap;
            cursor: pointer;
            font-size: 13px;
        }
    </style>
    <script src="peer.js"></script>
    <!-- <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script> -->
</head>
<body>

    <div id="chat-box">
        <div class="message peer">System: Initializing Peer Connection...</div>
    </div>

    <div class="macro-row">
        <button class="macro" onclick="useMacro('Yes! 👍')">Yes! 👍</button>
        <button class="macro" onclick="useMacro('No 👎')">No 👎</button>
        <button class="macro" onclick="useMacro('Wait a sec 🎮')">Wait a sec 🎮</button>
        <button class="macro" onclick="useMacro('Almost done')">Almost done</button>
    </div>

    <div class="typing-preview" id="preview-field"></div>

    <div class="keyboard-matrix">
        <!-- Row 1 -->
         <button class="key letter" onclick="press(':3')">:3</button>
        <button class="key letter" onclick="press('Q')">q</button>
        <button class="key letter" onclick="press('W')">w</button>
        <button class="key letter" onclick="press('E')">e</button>
        <button class="key letter" onclick="press('R')">r</button>
        <button class="key letter" onclick="press('T')">t</button>
        <button class="key letter" onclick="press('Y')">y</button>
        <button class="key letter" onclick="press('U')">u</button>
        <button class="key letter" onclick="press('I')">i</button>
        <button class="key letter" onclick="press('O')">o</button>
        <button class="key letter" onclick="press('P')">p</button>
        <button class="key wide" onclick="press('BACK')">BKSP</button>
        
        <!-- Row 2 -->
        <button class="key letter" onclick="press('A')">a</button>
        <button class="key letter" onclick="press('S')">s</button>
        <button class="key letter" onclick="press('D')">d</button>
        <button class="key letter" onclick="press('F')">f</button>
        <button class="key letter" onclick="press('G')">g</button>
        <button class="key letter" onclick="press('H')">h</button>
        <button class="key letter" onclick="press('J')">j</button>
        <button class="key letter" onclick="press('K')">k</button>
        <button class="key letter" onclick="press('L')">l</button>
        <button class="key shift" onclick="press('SHIFT')">SHIFT</button>
        <button class="key question-exclam" value="?" onclick="press(this)">?</button>

        <!-- Row 3 -->
        <button class="key letter" onclick="press('Z')">z</button>
        <button class="key letter" onclick="press('X')">x</button>
        <button class="key letter" onclick="press('C')">c</button>
        <button class="key letter" onclick="press('V')">v</button>
        <button class="key letter" onclick="press('B')">b</button>
        <button class="key letter" onclick="press('N')">n</button>
        <button class="key letter" onclick="press('M')">m</button>
        <button class="key" onclick="press(',')">,</button>
        <button class="key" onclick="press('.')">.</button>
        <button class="key space" onclick="press('SPACE')">Spacebar</button>
        <button class="key send-btn" onclick="dispatchMessage()">SEND</button>
    </div>

    <script>
        let currentText = "";
        let isCapitalized = false;
        const preview = document.getElementById('preview-field');
        
        let peer;
        let conn;

        // --- WebRTC Routing Setup ---
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');

        const iceConfig = {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' },
                    // Free public TURN servers to bridge strict NAT/Home Router firewalls.
                    {
                        urls: 'turn:openrelay.metered.ca:80',
                        username: 'openrelay',
                        credential: 'openrelay'
                    },
                    {
                        urls: 'turn:openrelay.metered.ca:443',
                        username: 'openrelay',
                        credential: 'openrelay'
                    }
                ]
            },
            debug: 1
        };

        if (roomId) {
            // Interlocutor's flow.
            peer = new Peer(iceConfig);
            // peer = new Peer({ debug: 3 });
            peer.on('open', (id) => {
                appendMessage("Establishing secure direct bridge to Heghine...", 'peer');
                conn = peer.connect(roomId);
                setupConnection();
            });
        } else {
            // Heghine's flow.
            const randomId = Math.random().toString(36).substring(2, 6).toUpperCase();
            peer = new Peer(randomId);
            
            peer.on('open', (id) => {
                appendMessage(`Ready! Copy this URL and drop it into Discord for them:\n\n${window.location.href}?room=${id}`, 'peer');
            });

            peer.on('connection', (connection) => {
                conn = connection;
                appendMessage("Connection established.", 'peer');
                setupConnection();
            });
        }

        function setupConnection() {
            conn.on('data', (data) => {
                appendMessage(data, 'peer');
            });
            conn.on('close', () => {
                appendMessage("Direct bridge closed.", 'peer');
            });
            conn.on('error', (err) => {
                appendMessage("Connection error occurred.", 'peer');
            });
        }

        function press(key) {
            if (key === 'BACK') {
                currentText = currentText.slice(0, -1);
            } else if (key === 'SHIFT') {
                isCapitalized = !isCapitalized;

                document.querySelector('.shift').classList.toggle('pressed');
                const questionExclam = document.querySelector('.question-exclam');
                questionExclam.innerHTML = isCapitalized ? '!' : '?';
                questionExclam.value = isCapitalized ? '!' : '?';
                
                // Dynamically transform visible layout buttons on screen.
                document.querySelectorAll('.key.letter').forEach(btn => {
                    btn.innerHTML = isCapitalized ? btn.innerHTML.toUpperCase() : btn.innerHTML.toLowerCase();
                });
            } else if (key === 'SPACE') {
                currentText += " ";
            } else {
                if (typeof key === 'string') {
                    currentText += isCapitalized ? key.toUpperCase() : key.toLowerCase();
                } else {
                    currentText += key.value; // Keeps literal "!" or "?" value assigned to element.
                }
            }
            preview.innerText = currentText;
        }

        function useMacro(text) {
            currentText = text;
            preview.innerText = currentText;
            dispatchMessage();
        }

        function dispatchMessage() {
            if (currentText.trim() === "") return;
            
            appendMessage(currentText, 'me');

            console.log(conn);
            
            // WIRED BACKEND: Fires layout payload safely across direct WebRTC channel.
            if (conn && conn.open) {
                conn.send(currentText);
            } else {
                appendMessage("System Error: No connected partner found to send data to.", 'peer');
            }
            
            currentText = "";
            preview.innerText = "";
        }

        function appendMessage(text, sender) {
            const box = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.innerText = text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
